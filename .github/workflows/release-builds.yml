# Builds the game for Windows and Linux.
#
# - When a release is published, both builds are attached to it:
#   HalosAndHorns.exe (Windows) and HalosAndHorns.x86_64 (Linux).
#   A file with the same name that is already on the release is replaced.
# - It can also be run by hand from the Actions tab; the builds are then
#   available as downloadable artifacts on the run page.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Must match the Godot version the project is made with (see project.godot).
  GODOT_VERSION: "4.7.2"
  # The official SHA-512 fingerprints of the two Godot downloads (from that
  # release's SHA512-SUMS.txt), written down here on purpose: they're checked
  # against what gets downloaded, so a tampered download can't bring along its
  # own matching fingerprint. Update both when GODOT_VERSION changes.
  GODOT_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
  TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach the builds to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # preset: the name in export_presets.cfg
          # template: Godot's export template file for that platform
          # file: the name of the finished game file
          - preset: Windows
            template: windows_release_x86_64.exe
            file: HalosAndHorns.exe
          - preset: Linux
            template: linux_release.x86_64
            file: HalosAndHorns.x86_64
    steps:
      # Third-party steps are pinned to an exact commit (not a tag that could be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The release tag is the game's version: v0.4.1 becomes "0.4.1" in the
      # menu, in the join check and in the new-version notice. Nothing in the
      # source needs changing for a release.
      - name: Stamp the release tag as the game's version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Release tag '$TAG' must look like v0.4.1"
            exit 1
          fi
          sed -i "s|^config/version=.*|config/version=\"${TAG#v}\"|" project.godot
          grep -x "config/version=\"${TAG#v}\"" project.godot

      - name: Download Godot and the ${{ matrix.preset }} export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          echo "$TEMPLATES_SHA512  templates.tpz" | sha512sum -c -
          unzip -q godot.zip -d "$RUNNER_TEMP"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j templates.tpz templates/version.txt "templates/${{ matrix.template }}" -d "$templates"
          rm godot.zip templates.tpz
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export the ${{ matrix.preset }} build
        run: |
          mkdir -p builds
          "$GODOT" --headless --export-release "${{ matrix.preset }}" "builds/${{ matrix.file }}"
          test -s "builds/${{ matrix.file }}"
          chmod +x "builds/${{ matrix.file }}"

      - name: Check the build starts
        if: matrix.preset == 'Linux'
        run: timeout 60 "builds/${{ matrix.file }}" --headless --quit-after 10

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HalosAndHorns-${{ matrix.preset }}
          path: builds/${{ matrix.file }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "builds/${{ matrix.file }}" --clobber
